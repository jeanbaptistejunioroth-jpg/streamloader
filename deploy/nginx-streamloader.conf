# Reverse proxy nginx pour StreamLoader.
# À copier sur le VPS dans /etc/nginx/sites-available/streamloader,
# puis : sudo ln -s /etc/nginx/sites-available/streamloader /etc/nginx/sites-enabled/
# Remplace TON-DOMAINE.com par ton vrai nom de domaine avant de l'utiliser.
# Une fois en place, certbot réécrira ce fichier automatiquement pour ajouter le HTTPS
# (voir VPS_DEPLOY_GUIDE.md, étape 5).

server {
    listen 80;
    listen [::]:80;
    server_name TON-DOMAINE.com www.TON-DOMAINE.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Nécessaire pour le suivi de progression en temps réel (SSE) :
        # sans ça, nginx bufferise la réponse et la barre de progression ne bouge pas.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
