<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Modération des avis — StreamLoader</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #13132A; color: #EEEEF8; margin: 0; padding: 32px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #9090B8; font-size: 13px; margin-bottom: 24px; }
  .token-box {
    display: flex; gap: 8px; margin-bottom: 28px;
  }
  input[type="password"], input[type="text"] {
    flex: 1; padding: 10px 12px; background: #1C1C38; border: 1px solid rgba(255,255,255,.13);
    border-radius: 8px; color: #EEEEF8; font-size: 13px; outline: none;
  }
  button {
    padding: 10px 16px; background: #7B5FF5; border: none; border-radius: 8px;
    color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  button:hover { opacity: .88; }
  button.reject { background: #EF4444; }
  button.approve { background: #22C55E; }
  .card {
    background: #1C1C38; border: 1px solid rgba(255,255,255,.13); border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }
  .stars { color: #F59E0B; font-size: 15px; letter-spacing: 2px; margin-bottom: 6px; }
  .comment { font-size: 13px; color: #EEEEF8; line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; }
  .meta { font-size: 11px; color: #5858A0; margin-bottom: 10px; }
  .actions { display: flex; gap: 8px; }
  .empty { color: #9090B8; font-size: 13px; text-align: center; padding: 40px 0; }
  .status { font-size: 12px; margin-bottom: 16px; min-height: 16px; }
  .status.err { color: #EF4444; }
  .status.ok { color: #22C55E; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Modération des avis</h1>
  <p class="sub">Page privée — ne pas partager ce lien.</p>

  <div class="token-box">
    <input type="password" id="tokenInput" placeholder="Jeton admin (ADMIN_TOKEN)">
    <button onclick="saveTokenAndLoad()">Connexion</button>
  </div>
  <div class="status" id="status"></div>

  <div id="list"></div>
</div>

<script>
function getToken() { return sessionStorage.getItem('sl_admin_token') || ''; }

function saveTokenAndLoad() {
  const val = document.getElementById('tokenInput').value.trim();
  if (!val) return;
  sessionStorage.setItem('sl_admin_token', val);
  document.getElementById('tokenInput').value = '';
  loadPending();
}

function setStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = 'status' + (isErr ? ' err' : msg ? ' ok' : '');
}

function starString(n) {
  return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
}

async function loadPending() {
  const token = getToken();
  if (!token) { setStatus('Entre le jeton admin pour voir les avis en attente.'); return; }

  setStatus('Chargement…');
  try {
    const res = await fetch('/api/admin/reviews/pending', {
      headers: { 'X-Admin-Token': token }
    });
    if (res.status === 401) {
      setStatus('Jeton invalide.', true);
      sessionStorage.removeItem('sl_admin_token');
      return;
    }
    const data = await res.json();
    setStatus('');
    renderList(data.reviews || []);
  } catch {
    setStatus('Erreur réseau.', true);
  }
}

function renderList(reviews) {
  const list = document.getElementById('list');
  if (reviews.length === 0) {
    list.innerHTML = '<div class="empty">Aucun avis en attente.</div>';
    return;
  }
  list.innerHTML = reviews.map(r => `
    <div class="card" data-id="${r.id}">
      <div class="stars">${starString(r.rating)}</div>
      ${r.comment ? `<div class="comment">${escapeHtml(r.comment)}</div>` : '<div class="comment" style="color:#5858A0">(pas de commentaire)</div>'}
      <div class="meta">${new Date(r.created_at + 'Z').toLocaleString('fr-FR')}</div>
      <div class="actions">
        <button class="approve" onclick="moderate(${r.id}, 'approve')">✓ Approuver</button>
        <button class="reject" onclick="moderate(${r.id}, 'reject')">✕ Rejeter</button>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function moderate(id, action) {
  const token = getToken();
  try {
    const res = await fetch(`/api/admin/reviews/${id}/${action}`, {
      method: 'POST',
      headers: { 'X-Admin-Token': token }
    });
    if (!res.ok) { setStatus('Erreur lors de la modération.', true); return; }
    document.querySelector(`.card[data-id="${id}"]`)?.remove();
    if (!document.querySelector('.card')) {
      document.getElementById('list').innerHTML = '<div class="empty">Aucun avis en attente.</div>';
    }
  } catch {
    setStatus('Erreur réseau.', true);
  }
}

if (getToken()) loadPending();
</script>
</body>
</html>
