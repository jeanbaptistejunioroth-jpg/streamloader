<div class="shell">

  <!-- ═══ Barre latérale ═══ -->
  <aside class="sidebar">
    <div class="side-logo" title="StreamLoader"><svg><use href="#i-logo"/></svg></div>
    <nav class="side-nav">
      <button class="side-btn" data-view="home" data-i18n-title="nav.home"><svg><use href="#i-home"/></svg></button>
      <button class="side-btn" data-view="videos" data-i18n-title="nav.videos"><svg><use href="#i-play"/></svg></button>
      <button class="side-btn" data-view="audio" data-i18n-title="nav.audio"><svg><use href="#i-music"/></svg></button>
      <button class="side-btn" data-view="queue" data-i18n-title="nav.queue"><svg><use href="#i-queue"/></svg><span class="side-badge" id="queueBadge" hidden></span></button>
      <div class="side-sep"></div>
      <button class="side-btn" data-view="account" data-i18n-title="nav.account"><svg><use href="#i-user"/></svg></button>
      <button class="side-btn" data-view="settings" data-i18n-title="nav.settings"><svg><use href="#i-gear"/></svg></button>
    </nav>
    <button class="side-avatar" id="sideAvatar" data-i18n-title="nav.account"><span class="avatar sm" id="sideAvatarImg"></span></button>
    <button class="side-btn side-logout" id="logoutBtn" data-i18n-title="nav.logout"><svg><use href="#i-logout"/></svg></button>
  </aside>

  <!-- ═══ Zone principale ═══ -->

</div>
    <header class="titlebar">
      <div class="tb-brand"><svg><use href="#i-logo"/></svg><span>StreamLoader</span></div>
      <div class="tb-drag"></div>
      <div class="tb-tools">
        <button class="tb-btn tb-lang" id="langBtn" data-i18n-title="win.lang"><svg><use href="#i-globe"/></svg><span id="langLabel">FR</span></button>
        <button class="tb-btn" id="themeBtn" data-i18n-title="win.theme"><svg id="themeIcon"><use href="#i-moon"/></svg></button>
      </div>
      <div class="tb-win">
        <button class="win-btn" id="winMin" data-i18n-title="win.min"><svg viewBox="0 0 12 12"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.1"/></svg></button>
        <button class="win-btn" id="winMax" data-i18n-title="win.max"><svg viewBox="0 0 12 12"><rect x="1.8" y="1.8" width="8.4" height="8.4" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
        <button class="win-btn win-close" id="winClose" data-i18n-title="win.close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
    </header>

    <!-- Barre de recherche / lien -->
    <div class="topbar" id="topbar">
      <form class="searchbox" id="searchForm" autocomplete="off">
        <svg class="sb-ico"><use href="#i-search"/></svg>
        <input id="urlInput" type="text" spellcheck="false" data-i18n-ph="search.ph">
        <div class="sb-sep"></div>
        <div class="fmt-wrap">
          <button type="button" class="fmt-btn" id="fmtBtn"><span id="fmtLabel">MP4 1080p</span><svg><use href="#i-chev"/></svg></button>
          <div class="menu fmt-menu" id="fmtMenu" hidden></div>
        </div>
        <button type="submit" class="ok-btn" id="okBtn"><span data-i18n="search.ok">OK</span></button>
      </form>
    </div>

    <!-- ═══ Vues ═══ -->
    <section class="view" id="view-list">
      <div class="list-head">
        <h2 id="listTitle" data-i18n="home.title">Téléchargés récemment</h2>
        <button class="ghost-btn" id="clearBtn"><svg><use href="#i-trash"/></svg><span data-i18n="list.clear">Tout effacer</span></button>
      </div>
      <div class="list" id="list"></div>
      <div class="dropzone" id="dropzone">
        <svg><use href="#i-upload"/></svg>
        <p class="dz-title" data-i18n="drop.title">Glisse ton lien ici ou utilise CTRL + V</p>
        <p class="dz-sub" data-i18n="drop.sub"></p>
      </div>
    </section>

    <section class="view" id="view-settings" hidden>
      <h1 class="page-title" data-i18n="settings.title">Paramètres</h1>
      <div class="set-list">
        <div class="set-row set-col">
          <div class="set-txt"><b data-i18n="settings.folder"></b><span class="set-path" id="setFolder"></span><small data-i18n="settings.folderSub"></small></div>
          <div class="set-actions">
            <button class="out-btn" id="browseBtn" data-i18n="settings.browse">Parcourir</button>
            <button class="out-btn" id="openFolderBtn" data-i18n="settings.openFolder">Ouvrir</button>
          </div>
        </div>
        <div class="set-row">
          <div class="set-txt"><b data-i18n="settings.format"></b><small data-i18n="settings.formatSub"></small></div>
          <select class="select" id="setFormat"></select>
        </div>
        <div class="set-row">
          <div class="set-txt"><b data-i18n="settings.auto"></b><small data-i18n="settings.autoSub"></small></div>
          <label class="switch"><span class="switch-lbl" id="autoLbl"></span><input type="checkbox" id="setAuto"><i></i></label>
        </div>
        <div class="set-row">
          <div class="set-txt"><b data-i18n="settings.concurrent"></b><small data-i18n="settings.concurrentSub"></small></div>
          <select class="select" id="setConcurrent"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </div>
        <div class="set-row">
          <div class="set-txt"><b data-i18n="settings.notif"></b><small data-i18n="settings.notifSub"></small></div>
          <label class="switch"><span class="switch-lbl" id="notifLbl"></span><input type="checkbox" id="setNotif"><i></i></label>
        </div>
        <div class="set-row">
          <div class="set-txt"><b data-i18n="settings.theme"></b><small data-i18n="settings.themeSub"></small></div>
          <div class="seg" id="setTheme">
            <button data-v="light"><svg><use href="#i-sun"/></svg><span data-i18n="settings.light"></span></button>
            <button data-v="dark"><svg><use href="#i-moon"/></svg><span data-i18n="settings.dark"></span></button>
            <button data-v="system"><span data-i18n="settings.system"></span></button>
          </div>
        </div>
        <div class="set-row">
          <div class="set-txt"><b data-i18n="settings.lang"></b><small data-i18n="settings.langSub"></small></div>
          <select class="select" id="setLang"><option value="fr">Français</option><option value="en">English</option></select>
        </div>
        <div class="set-row" id="rowEngine" hidden>
          <div class="set-txt"><b data-i18n="settings.engine"></b><small id="engineTxt"></small></div>
          <button class="out-btn" id="engineBtn" data-i18n="settings.engineUpdate"></button>
        </div>
        <div class="set-row" id="rowCookies" hidden>
          <div class="set-txt"><b data-i18n="settings.cookies"></b><small data-i18n="settings.cookiesSub"></small></div>
          <select class="select" id="setCookies">
            <option value="none" data-i18n="settings.cookiesNone"></option>
            <option value="firefox">Firefox</option><option value="edge">Microsoft Edge</option><option value="chrome">Google Chrome</option>
            <option value="brave">Brave</option><option value="opera">Opera</option><option value="vivaldi">Vivaldi</option>
          </select>
        </div>
        <button class="set-row set-link" id="subLink">
          <div class="set-txt"><b data-i18n="settings.sub"></b><small data-i18n="settings.subSub"></small></div>
          <svg class="ext"><use href="#i-ext"/></svg>
        </button>
        <details class="set-row set-adv" id="rowServer">
          <summary class="set-txt"><b data-i18n="settings.server"></b><small data-i18n="settings.serverSub"></small></summary>
          <form class="server-form" id="serverForm">
            <input class="input" id="setServer" type="text" spellcheck="false">
            <button class="out-btn" type="submit" data-i18n="settings.save">Enregistrer</button>
          </form>
        </details>
      </div>
      <div class="set-foot">
        <button class="danger-btn" id="logoutBtn2" data-i18n="nav.logout">Déconnexion</button>
        <span class="version" id="versionTxt"></span>
      </div>
    </section>

    <section class="view" id="view-account" hidden>
      <div class="acc-wrap">
        <div class="profile-card">
          <div class="profile-cover">
            <svg class="cv m1" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg class="cv m2" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <svg class="cv m3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
            <svg class="cv m4" viewBox="0 0 24 24"><line x1="4" y1="10" x2="4" y2="14"/><line x1="8" y1="6" x2="8" y2="18"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="16" y1="8" x2="16" y2="16"/><line x1="20" y1="11" x2="20" y2="13"/></svg>
          </div>
          <div class="profile-main">
            <div class="avatar-wrap">
              <div class="avatar xl" id="accAvatar"></div>
              <button class="avatar-edit" id="photoBtn" data-i18n-title="acc.photoChange"><svg><use href="#i-camera"/></svg></button>
            </div>
            <div class="profile-id">
              <div class="profile-name"><span id="accName"></span><span class="badge prem"><svg><use href="#i-crown"/></svg><span id="accBadge">Premium</span></span></div>
              <div class="profile-email" id="accEmail"></div>
            </div>
            <div class="profile-photo-actions">
              <button class="out-btn sm" id="photoChange"><svg><use href="#i-camera"/></svg><span data-i18n="acc.photoChange"></span></button>
              <button class="link-btn" id="photoRemove" data-i18n="acc.photoRemove"></button>
            </div>
          </div>
          <div class="profile-stats">
            <div class="stat"><small data-i18n="acc.plan"></small><b id="accPlan"></b></div>
            <div class="stat"><small data-i18n="acc.until"></small><b id="accUntil"></b></div>
            <div class="stat"><small data-i18n="acc.status"></small><b class="ok" id="accStatus"></b></div>
            <div class="stat"><small data-i18n="acc.count"></small><b id="accCount"></b></div>
          </div>
          <div class="acc-offline" id="accOffline" hidden data-i18n="account.offline"></div>
        </div>

        <form class="acc-box" id="nameForm" hidden>
          <div class="acc-box-head"><b data-i18n="acc.name"></b></div>
          <div class="server-form"><input class="input" id="nameInput" maxlength="40" data-i18n-ph="acc.namePh"><button class="out-btn" type="submit" data-i18n="settings.save"></button></div>
        </form>

        <div class="acc-actions" id="accActions">
          <button class="primary-btn" id="manageBtn"><span data-i18n="account.manage"></span><svg><use href="#i-ext"/></svg></button>
          <button class="out-btn" id="checkBtn"><svg class="ico16"><use href="#i-retry"/></svg><span data-i18n="account.check"></span></button>
          <button class="danger-btn" id="logoutBtn3"><svg class="ico16"><use href="#i-logout"/></svg><span data-i18n="nav.logout"></span></button>
        </div>

        <div class="acc-box" id="apiBox">
          <div class="acc-box-head"><b data-i18n="api.title"></b><span class="badge">Premium</span></div>
          <p class="acc-box-sub" data-i18n="api.sub"></p>
          <div id="apiLoading" class="acc-box-sub" data-i18n="api.loading"></div>
          <div id="apiNoKey" hidden><button class="primary-btn" id="apiGenBtn" data-i18n="api.generate"></button></div>
          <div id="apiHasKey" hidden>
            <code class="api-key" id="apiKeyTxt"></code>
            <div class="btn-row">
              <button class="out-btn sm" id="apiShowBtn"></button>
              <button class="out-btn sm" id="apiCopyBtn" data-i18n="api.copy"></button>
              <button class="out-btn sm" id="apiRegenBtn" data-i18n="api.regen"></button>
              <button class="danger-btn sm" id="apiRevokeBtn" data-i18n="api.revoke"></button>
            </div>
            <p class="acc-box-sub" id="apiLegacy" hidden data-i18n="api.legacy"></p>
            <p class="acc-box-sub" id="apiDate"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- Connexion -->
    <section class="view view-auth" id="view-login" hidden>
      <div class="auth-split">
        <aside class="auth-brand">
          <svg class="ab-m ab-m1" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg class="ab-m ab-m2" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <svg class="ab-m ab-m3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          <div class="ab-logo"><svg><use href="#i-logo"/></svg><span>StreamLoader</span></div>
          <div class="ab-mid">
            <h2 data-i18n="login.brandTitle"></h2>
            <ul class="ab-feats">
              <li><span><svg><use href="#i-check"/></svg></span><b data-i18n="login.f1"></b></li>
              <li><span><svg><use href="#i-check"/></svg></span><b data-i18n="login.f2"></b></li>
              <li><span><svg><use href="#i-check"/></svg></span><b data-i18n="login.f3"></b></li>
              <li><span><svg><use href="#i-check"/></svg></span><b data-i18n="login.f4"></b></li>
            </ul>
          </div>
          <div class="ab-foot"><svg><use href="#i-shield"/></svg><span data-i18n="login.secure"></span></div>
        </aside>
        <div class="auth-side">
          <form class="auth-form" id="loginForm" novalidate>
            <span class="badge prem"><svg><use href="#i-crown"/></svg>Premium</span>
            <h1 data-i18n="login.title"></h1>
            <p class="auth-sub" data-i18n="login.sub"></p>
            <label class="field"><span data-i18n="login.email"></span>
              <div class="input-ico"><svg><use href="#i-mail"/></svg><input class="input" id="loginEmail" type="email" autocomplete="username" placeholder="toi@exemple.com"></div>
            </label>
            <label class="field"><span data-i18n="login.password"></span>
              <div class="input-ico"><svg><use href="#i-lock"/></svg><input class="input" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
                <button type="button" class="eye-btn" id="eyeBtn" tabindex="-1"><svg><use href="#i-eye"/></svg></button></div>
            </label>
            <div class="form-err" id="loginErr" hidden></div>
            <button class="primary-btn wide" id="loginBtn" type="submit"><span data-i18n="login.submit"></span></button>
            <div class="auth-div"><span data-i18n="login.or"></span></div>
            <button type="button" class="out-btn wide" id="createLink"><span data-i18n="login.create"></span><svg class="ico16"><use href="#i-ext"/></svg></button>
            <p class="auth-foot"><span data-i18n="login.noAccount"></span> <a href="#" id="discoverLink" data-i18n="login.discover"></a></p>
          </form>
        </div>
      </div>
    </section>

    <!-- Compte non Premium -->
    <section class="view view-center" id="view-gate" hidden>
      <div class="auth-card gate">
        <div class="gate-ico"><svg><use href="#i-crown"/></svg></div>
        <h1 data-i18n="gate.title"></h1>
        <p class="auth-sub" data-i18n="gate.sub"></p>
        <p class="gate-email" id="gateEmail"></p>
        <div class="form-err" id="gateErr" hidden></div>
        <button class="primary-btn wide" id="upgradeBtn"><span data-i18n="gate.upgrade"></span><svg><use href="#i-ext"/></svg></button>
        <button class="out-btn wide" id="recheckBtn" data-i18n="gate.recheck"></button>
        <button class="link-btn" id="gateLogout" data-i18n="nav.logout"></button>
      </div>
    </section>
  </main>
</div>


<!-- Fiche de la vidéo : options avant le téléchargement -->
<div class="modal-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="sheet-x" id="sheetClose" data-i18n-title="win.close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <div class="sheet-head">
      <div class="thumb" id="shThumb"></div>
      <div class="sheet-info">
        <div class="sheet-kicker" id="shKicker"></div>
        <div class="sheet-title" id="shTitle"></div>
        <div class="dl-meta" id="shMeta"></div>
      </div>
    </div>
    <div class="sheet-body">
      <div class="sheet-sec" id="plSec" hidden>
        <div class="sec-row"><h4 data-i18n="sheet.videos"></h4><label class="chk"><input type="checkbox" id="plAll" checked><span data-i18n="sheet.all"></span></label></div>
        <div class="pl-list" id="plList"></div>
        <p class="hint" id="plNote"></p>
      </div>
      <div class="sheet-sec">
        <h4 data-i18n="sheet.format"></h4>
        <div class="q-grid" id="qGrid"></div>
      </div>
      <div class="sheet-sec" id="subSec">
        <label class="switch sw-left"><input type="checkbox" id="subToggle"><i></i><span data-i18n="sheet.subs"></span></label>
        <div class="sub-opts" id="subOpts" hidden>
          <select class="select" id="subLang">
            <option value="fr">Français</option><option value="en">English</option><option value="es">Español</option>
            <option value="it">Italiano</option><option value="de">Deutsch</option><option value="ar">العربية</option>
          </select>
          <p class="hint" data-i18n="sheet.subsHint"></p>
        </div>
      </div>
      <div class="sheet-sec" id="trimSec">
        <label class="switch sw-left"><input type="checkbox" id="trimToggle"><i></i><span data-i18n="sheet.trim"></span></label>
        <div class="trim-opts" id="trimOpts" hidden>
          <label class="field"><span data-i18n="sheet.start"></span><input class="input mono" id="trimStart" placeholder="00:10"></label>
          <label class="field"><span data-i18n="sheet.end"></span><input class="input mono" id="trimEnd" placeholder="00:25"></label>
          <p class="hint full" data-i18n="sheet.trimHint"></p>
        </div>
      </div>
      <div class="form-err" id="sheetErr" hidden></div>
    </div>
    <div class="sheet-foot">
      <button class="out-btn" id="sheetCancel" data-i18n="sheet.cancel"></button>
      <button class="primary-btn" id="sheetGo"><svg><use href="#i-upload"/></svg><span id="sheetGoTxt"></span></button>
    </div>
  </div>
</div>
<div class="menu ctx-menu" id="ctxMenu" hidden></div>
<div class="drop-overlay" id="dropOverlay" hidden><div><svg><use href="#i-upload"/></svg><p data-i18n="drop.release"></p></div></div>
<div class="toasts" id="toasts"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
